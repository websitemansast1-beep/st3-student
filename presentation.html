<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>العرض التقديمي | MFX Student</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo">
        <div class="logo-mark">🎓</div>
        <span class="text-gradient">MFX Student</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">كورساتي</a></li>
        <li><a href="dashboard.html">لوحتي</a></li>
        <li><a href="chat.html">💬 المعلم</a></li>
      </ul>
      <div class="nav-actions">
        <a href="#" id="back-to-course" class="btn btn-ghost">← رجوع للكورس</a>
      </div>
    </div>
  </nav>

  <section class="viewer-section" style="padding: 110px 0 60px;">
    <div class="container viewer-container" style="max-width:1000px;">
      <h1 id="presentation-title" style="font-size:clamp(1.4rem, 3vw, 2rem); margin-bottom:20px;">جاري التحميل...</h1>

      <div id="presentation-viewer" class="viewer-frame-wrap" style="position:relative; padding-top:62%; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden;">
        <iframe id="presentation-frame" style="position:absolute; inset:0; width:100%; height:100%; border:0;" allowfullscreen></iframe>
        <!-- Renders on top of the iframe (pointer-events:none so slide
             navigation inside the embed still works) so any screenshot or
             recording carries the student's name/code and is traceable. -->
        <div id="presentation-watermark" style="position:absolute; inset:0; pointer-events:none; overflow:hidden;"></div>
        <div id="presentation-blur-cover" style="position:absolute; inset:0; backdrop-filter:blur(20px); background:rgba(10,10,15,0.85); display:none; align-items:center; justify-content:center; text-align:center; padding:20px; color:var(--text-secondary); font-size:0.9rem;">
          العرض مخفي مؤقتًا — ارجع لصفحة العرض عشان يظهر تاني
        </div>
      </div>

      <p style="margin-top:16px; text-align:center; color:var(--text-muted); font-size:0.8rem;">
        هذا العرض خاص بك ولا يجوز مشاركته أو تصويره — اسمك وكودك ظاهرين عليه.
      </p>
    </div>
  </section>

  <script src="js/app.js"></script>
</body>
</html>
