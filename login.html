<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل دخول الطالب | MFX</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <a href="index.html" class="logo" style="justify-content:center; margin-bottom:36px;">
        <div class="logo-mark">🎓</div>
        <span class="text-gradient">MFX Student</span>
      </a>
      <h2>تسجيل دخول الطالب</h2>
      <p>أدخل الكود الذي حصلت عليه من المعلم</p>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>كود الطالب</label>
          <input type="text" class="inp" id="login-code" placeholder="مثال: A7B9C2" required>
        </div>
        <div class="form-group">
          <label>الاسم الكامل</label>
          <input type="text" class="inp" id="login-name" placeholder="أدخل اسمك الثلاثي" required>
        </div>
        <div class="form-group">
          <label>رقم التليفون</label>
          <input type="tel" class="inp" id="login-phone" placeholder="01xxxxxxxxx" autocomplete="tel" required>
        </div>
        <div class="form-group">
          <label>رقم تليفون ولي الأمر</label>
          <input type="tel" class="inp" id="login-guardian-phone" placeholder="01xxxxxxxxx" autocomplete="tel" required>
        </div>
        <button type="submit" class="btn btn-primary" id="login-submit-btn" style="width:100%; margin-top:8px;">دخول</button>
      </form>

      <div style="margin-top:24px; text-align:center;">
        <p style="color:var(--text-muted); font-size:0.85rem;">
          ليس لديك كود؟ <span style="color:var(--text-secondary);">تواصل مع المعلم للحصول على كود دخول</span>
        </p>
      </div>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
