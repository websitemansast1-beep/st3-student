<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صيانة</title>
<style>
  /* ========== RESET & GLOBAL ========== */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: 'Segoe UI', 'Tahoma', 'Arial', system-ui, -apple-system, sans-serif;
    background: #F8F7F4;
    background-image:
      radial-gradient(ellipse 70% 50% at 50% 0%, rgba(201, 162, 39, 0.05), transparent 65%),
      radial-gradient(ellipse 60% 40% at 100% 100%, rgba(15, 23, 42, 0.03), transparent 60%);
    min-height: 100vh;
    color: #1E293B;
    line-height: 1.9;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ========== ANIMATIONS (subtle & elegant) ========== */
  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(24px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @keyframes slideDown {
    from {
      opacity: 0;
      transform: translateY(-14px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes lineGrow {
    from { transform: scaleX(0); }
    to   { transform: scaleX(1); }
  }

  @keyframes softFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-4px); }
  }

  @keyframes softGlow {
    0%, 100% { opacity: 0.5; }
    50%      { opacity: 0.9; }
  }

  /* ========== HERO SECTION ========== */
  .hero {
    position: relative;
    padding: 80px 24px 80px;
    text-align: center;
    overflow: hidden;
    animation: fadeIn 1s ease both;
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
  }

  /* Subtle gold arc behind hero */
  .hero::before {
    content: "";
    position: absolute;
    top: -120px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201, 162, 39, 0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .hero-content {
    position: relative;
    z-index: 1;
    max-width: 880px;
    margin: 0 auto;
  }

  /* Official icon — navy circle with gold ring */
  .hero-icon {
    width: 96px;
    height: 96px;
    margin: 0 auto 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0F172A;
    font-size: 42px;
    color: #C9A227;
    border: 2px solid #C9A227;
    box-shadow:
      0 6px 20px -6px rgba(15, 23, 42, 0.25),
      0 0 0 8px rgba(201, 162, 39, 0.06);
    animation: softFloat 5s ease-in-out infinite;
  }

  /* Main headline */
  .hero h1 {
    font-size: clamp(48px, 10vw, 110px);
    font-weight: 900;
    line-height: 1.2;
    margin-bottom: 0;
    letter-spacing: -2px;
    color: #0F172A;
    animation: slideDown 0.9s 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  /* Gold underline accent for headline */
  .hero h1::after {
    content: "";
    display: block;
    width: 90px;
    height: 4px;
    margin: 28px auto 0;
    background: #C9A227;
    border-radius: 0;
    animation: lineGrow 1s 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    transform-origin: center;
  }

  /* ========== BOTTOM DECORATIVE ELEMENT ========== */
  .bottom-accent {
    text-align: center;
    padding-top: 50px;
    animation: fadeIn 1.2s 1.2s ease both;
  }

  .bottom-accent .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #C9A227;
    margin: 0 6px;
    opacity: 0.4;
    animation: softGlow 2.4s ease-in-out infinite;
  }

  .bottom-accent .dot:nth-child(2) {
    animation-delay: 0.4s;
    background: #334E68;
  }

  .bottom-accent .dot:nth-child(3) {
    animation-delay: 0.8s;
    background: #C9A227;
  }

  /* ========== RESPONSIVE ========== */
  @media (max-width: 768px) {
    .hero {
      padding: 60px 20px 60px;
    }

    .hero-icon {
      width: 78px;
      height: 78px;
      font-size: 34px;
      margin-bottom: 28px;
    }

    .hero h1 {
      letter-spacing: -1.5px;
    }
  }

  @media (max-width: 520px) {
    .hero {
      padding: 50px 16px 50px;
    }

    .hero-icon {
      width: 68px;
      height: 68px;
      font-size: 28px;
      margin-bottom: 24px;
      border-width: 1.5px;
    }

    .hero h1::after {
      width: 70px;
      height: 3px;
      margin-top: 22px;
    }
  }

  /* ========== PRINT ========== */
  @media print {
    body {
      background: #fff;
      color: #000;
    }
    .hero-icon {
      box-shadow: none;
    }
  }
</style>
</head>
<body>

  <!-- ===== HERO SECTION ===== -->
  <header class="hero">
    <div class="hero-content">
      <div class="hero-icon">🛠️</div>
      <h1>صيانة</h1>
      <div class="bottom-accent">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </header>

</body>
</html>
