<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الفيديو | MFX Student</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo">
        <div class="logo-mark">🎓</div>
        <span class="text-gradient">MFX Student</span>
      </a>
      <button class="mfx-nav-toggle" onclick="toggleMfxNav()" aria-label="فتح القائمة">☰</button>
      <ul class="nav-links">
        <li><a href="index.html">كورساتي</a></li>
        <li><a href="dashboard.html">لوحتي</a></li>
        <li><a href="chat.html">💬 المعلم</a></li>
      </ul>
      <div class="nav-actions">
        <a href="#" id="back-to-course" class="btn btn-ghost">← رجوع للكورس</a>
      </div>
    </div>
  </nav>

  <section class="viewer-section" style="padding: 110px 0 60px;">
    <div class="container viewer-container" style="max-width:900px;">
      <h1 id="video-title" style="font-size:clamp(1.4rem, 3vw, 2rem); margin-bottom:20px;">جاري التحميل...</h1>

      <div class="viewer-frame-wrap" style="position:relative; padding-top:56.25%; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; margin-bottom:32px;">
        <iframe id="video-frame" style="position:absolute; inset:0; width:100%; height:100%; border:0;" allow="autoplay" allowfullscreen></iframe>
      </div>

      <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:24px;">
        <h3 style="margin-bottom:20px;">💬 التعليقات</h3>

        <div style="display:flex; gap:10px; margin-bottom:24px;">
          <input type="text" id="comment-input" class="inp" placeholder="اكتب تعليقك على الفيديو..." maxlength="2000" onkeydown="if(event.key==='Enter') postComment()">
          <button class="btn btn-primary" onclick="postComment()">إرسال</button>
        </div>

        <div id="comments-list" style="display:flex; flex-direction:column; gap:14px;">
          <div class="skel" style="height:50px;"></div>
        </div>
        <div class="empty" id="comments-empty" style="display:none; padding:24px 0;">
          <div class="empty-icon" style="font-size:2.5rem;">💬</div>
          <h3>لا توجد تعليقات بعد</h3>
          <p>كن أول من يعلق على هذا الفيديو</p>
        </div>
      </div>
    </div>
  </section>

  <script src="js/app.js"></script>
</body>
</html>
